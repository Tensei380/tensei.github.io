<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tensei Extensions</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
        }

        header {
            padding: 25px;
            background: #181818;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 50px 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 40px;
        }

        .title h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .title p {
            color: #aaaaaa;
        }

        .card {
            background: #181818;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        .card h3 {
            margin-top: 0;
            font-size: 24px;
        }

        .card p {
            color: #aaaaaa;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 22px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .button:hover {
            opacity: 0.8;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777777;
        }
    </style>
</head>

<body>

    <header>
        <h1>TENSEI</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="extensions.html">Extensions</a>
            <a href="#">About</a>
        </nav>
    </header>

    <div class="container">

        <div class="title">
            <h2>Extensions</h2>
            <p>Explore Tensei extensions and providers.</p>
        </div>

        <div class="card">
            <h3>Anime Extension</h3>

            <p>
                An extension for accessing anime content
                through supported providers.
            </p>

            <a href="#" class="button">View Extension</a>
        </div>

        <div class="card">
            <h3>Movie Extension</h3>

            <p>
                A movie provider extension for the Tensei
                repository.
            </p>

            <a href="#" class="button">View Extension</a>
        </div>

    </div>

    <footer>
        © 2026 Tensei
    </footer>

</body>
</html>
