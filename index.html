<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tensei</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            background: #181818;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .hero {
            padding: 100px 20px;
        }

        .hero h2 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #bbbbbb;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .button:hover {
            opacity: 0.8;
        }

        footer {
            padding: 20px;
            color: #777777;
        }
    </style>
</head>

<body>

    <header>
        <h1>TENSEI</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Extensions</a>
            <a href="#">About</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Welcome to Tensei</h2>

        <p>
            Extensions, providers and more.
        </p>

        <a href="#" class="button">Explore</a>
    </section>

    <footer>
        © 2026 Tensei
    </footer>

</body>
</html>
