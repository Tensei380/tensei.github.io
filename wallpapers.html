<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tensei Wallpapers</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f0f0f;
    color:white;
}

header{
    padding:25px;
    background:#181818;
    text-align:center;
}

header h1{
    margin:0;
    font-size:32px;
}

nav{
    margin-top:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 12px;
    font-size:15px;
}

nav a:hover{
    text-decoration:underline;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

h2{
    text-align:center;
    margin-bottom:25px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin-bottom:30px;
}

#search{
    width:260px;
    padding:12px 15px;
    border:0;
    border-radius:8px;
    outline:none;
}

.filter{
    padding:11px 15px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    background:#222;
    color:white;
}

.filter.active,
.filter:hover{
    background:white;
    color:black;
}

.grid{
    display:grid;
    grid-template-columns:repeat(
        auto-fit,
        minmax(240px,1fr)
    );
    gap:22px;
}

.card{
    background:#181818;
    border-radius:12px;
    overflow:hidden;
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
}

.card img{
    width:100%;
    height:320px;
    object-fit:contain;
    background:#111;
    display:block;
    cursor:pointer;
}

.info{
    padding:16px;
}

.info h3{
    margin:0 0 10px;
    font-size:18px;
}

.meta{
    color:#aaa;
    font-size:13px;
    line-height:1.7;
}

.buttons{
    display:flex;
    gap:8px;
    margin-top:14px;
}

.button{
    flex:1;
    padding:11px;
    border:0;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
}

.preview{
    background:#333;
    color:white;
}

.download{
    background:white;
    color:black;
}

.button:hover{
    opacity:.8;
}

.loading,
.empty{
    text-align:center;
    color:#aaa;
    padding:40px;
    grid-column:1/-1;
}

footer{
    padding:30px;
    text-align:center;
    color:#777;
}


/* =========================
   FULLSCREEN PREVIEW
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-content{
    width:100%;
    max-width:1100px;
    max-height:95vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
}

.modal-image{
    max-width:100%;
    max-height:70vh;
    object-fit:contain;
    border-radius:8px;
    box-shadow:0 0 30px rgba(0,0,0,.8);
}

.close{
    position:absolute;
    top:-10px;
    right:0;
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:white;
    color:black;
    font-size:24px;
    cursor:pointer;
    z-index:2;
}

.preview-info{
    width:100%;
    max-width:800px;
    margin-top:18px;
    background:#181818;
    padding:18px;
    border-radius:10px;
}

.preview-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.preview-url{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.preview-url input{
    flex:1;
    min-width:0;
    padding:11px;
    border:0;
    border-radius:7px;
    background:#252525;
    color:#ddd;
}

.copy{
    padding:11px 16px;
    border:0;
    border-radius:7px;
    background:white;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.modal-buttons a,
.modal-buttons button{
    padding:11px 18px;
    border:0;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
}

.modal-download{
    background:white;
    color:black;
}

.modal-close{
    background:#333;
    color:white;
}


/* Mobile */

@media(max-width:600px){

    .grid{
        grid-template-columns:
            repeat(2,1fr);
        gap:12px;
    }

    .card img{
        height:230px;
    }

    .info{
        padding:12px;
    }

    .info h3{
        font-size:15px;
    }

    .buttons{
        flex-direction:column;
    }

    .modal{
        padding:12px;
    }

    .modal-image{
        max-height:55vh;
    }

    .preview-url{
        flex-direction:column;
    }

    .modal-buttons{
        width:100%;
        flex-direction:column;
    }

    .modal-buttons a,
    .modal-buttons button{
        width:100%;
    }

}
</style>
</head>

<body>

<header>

    <h1>TENSEI</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="wallpapers.html">Wallpapers</a>
        <a href="#">About</a>
    </nav>

</header>


<div class="container">

    <h2>Wallpapers</h2>


    <div class="controls">

        <input
            id="search"
            type="search"
            placeholder="Search wallpapers..."
        >

        <button
            class="filter active"
            data-cat="all"
        >
            All
        </button>

        <button
            class="filter"
            data-cat="anime"
        >
            Anime
        </button>

        <button
            class="filter"
            data-cat="aesthetic"
        >
            Aesthetic
        </button>

        <button
            class="filter"
            data-cat="dark"
        >
            Dark
        </button>

        <button
            class="filter"
            data-cat="gaming"
        >
            Gaming
        </button>

        <button
            class="filter"
            data-cat="nature"
        >
            Nature
        </button>

    </div>


    <div id="grid" class="grid">

        <div class="loading">
            Loading wallpapers...
        </div>

    </div>

</div>


<footer>
    © 2026 Tensei
</footer>


<!-- =========================
     PREVIEW MODAL
========================= -->

<div
    id="modal"
    class="modal"
>

    <div class="modal-content">

        <button
            id="closeModal"
            class="close"
        >
            ×
        </button>


        <img
            id="modalImage"
            class="modal-image"
            src=""
            alt=""
        >


        <div class="preview-info">

            <div
                id="modalTitle"
                class="preview-title"
            >
                Wallpaper
            </div>


            <div
                id="modalMeta"
                class="meta"
            ></div>


            <div class="preview-url">

                <input
                    id="imageUrl"
                    type="text"
                    readonly
                >

                <button
                    id="copyUrl"
                    class="copy"
                >
                    Copy URL
                </button>

            </div>


            <div class="modal-buttons">

                <a
                    id="modalDownload"
                    class="modal-download"
                    href=""
                    download
                >
                    Download
                </a>

                <button
                    id="modalCloseButton"
                    class="modal-close"
                >
                    Close
                </button>

            </div>

        </div>

    </div>

</div>


<script>

const API =
"https://api.github.com/repos/Tensei380/Tensei380.github.io/contents/wallpapers";


const categories = [
    "anime",
    "aesthetic",
    "dark",
    "gaming",
    "nature"
];


let wallpapers = [];

let selectedCategory = "all";


/* =========================
   TITLE
========================= */

function cleanTitle(filename){

    let name =
        filename.replace(
            /\.[^/.]+$/,
            ""
        );


    name =
        name
        .replace(/[_-]/g," ")
        .replace(
            /\b(anime|aesthetic|dark|gaming|nature)\b/gi,
            ""
        )
        .replace(/\s+/g," ")
        .trim();


    return name
        .replace(
            /\b\w/g,
            c => c.toUpperCase()
        )
        || "Wallpaper";
}


/* =========================
   CATEGORY
========================= */

function getCategories(filename){

    const lower =
        filename.toLowerCase();


    return categories.filter(cat =>

        new RegExp(
            "(^|[_\\-\\s])" +
            cat +
            "([_\\-\\s.]|$)",
            "i"
        ).test(lower)

    );

}


/* =========================
   FORMAT
========================= */

function getFormat(filename){

    const match =
        filename.match(
            /\.([^.]+)$/
        );


    return match
        ? match[1].toUpperCase()
        : "IMAGE";

}


/* =========================
   CREATE CARD
========================= */

function createCard(file){

    const imageUrl =
        "wallpapers/" +
        encodeURIComponent(file.name);


    const card =
        document.createElement("div");

    card.className = "card";


    /* IMAGE */

    const img =
        document.createElement("img");

    img.src = imageUrl;

    img.alt =
        cleanTitle(file.name);

    img.loading = "lazy";


    /* CLICK IMAGE */

    img.addEventListener(
        "click",
        () => {

            openPreview(
                file,
                imageUrl
            );

        }
    );


    /* INFO */

    const info =
        document.createElement("div");

    info.className = "info";


    /* TITLE */

    const title =
        document.createElement("h3");

    title.textContent =
        cleanTitle(file.name);


    /* META */

    const meta =
        document.createElement("div");

    meta.className = "meta";


    const cats =
        getCategories(file.name);


    meta.textContent =
        "Category: " +
        (
            cats.length
            ? cats.join(" • ")
            : "Wallpaper"
        ) +
        " | Format: " +
        getFormat(file.name);


    /* RESOLUTION */

    const resolution =
        document.createElement("div");


    img.onload = () => {

        resolution.textContent =
            "Resolution: " +
            img.naturalWidth +
            " × " +
            img.naturalHeight;

        meta.appendChild(
            resolution
        );

    };


    /* BUTTONS */

    const buttons =
        document.createElement("div");

    buttons.className = "buttons";


    /* PREVIEW BUTTON */

    const preview =
        document.createElement("button");

    preview.className =
        "button preview";

    preview.textContent =
        "Preview";


    preview.addEventListener(
        "click",
        () => {

            openPreview(
                file,
                imageUrl
            );

        }
    );


    /* DOWNLOAD */

    const download =
        document.createElement("a");

    download.className =
        "button download";

    download.href =
        imageUrl;

    download.download =
        file.name;

    download.textContent =
        "Download";


    buttons.appendChild(
        preview
    );

    buttons.appendChild(
        download
    );


    info.appendChild(
        title
    );

    info.appendChild(
        meta
    );

    info.appendChild(
        buttons
    );


    card.appendChild(
        img
    );

    card.appendChild(
        info
    );


    return card;
}


/* =========================
   OPEN PREVIEW
========================= */

function openPreview(
    file,
    imageUrl
){

    const modal =
        document.getElementById(
            "modal"
        );


    const modalImage =
        document.getElementById(
            "modalImage"
        );


    const modalTitle =
        document.getElementById(
            "modalTitle"
        );


    const modalMeta =
        document.getElementById(
            "modalMeta"
        );


    const imageUrlInput =
        document.getElementById(
            "imageUrl"
        );


    const modalDownload =
        document.getElementById(
            "modalDownload"
        );


    /* FULL URL */

    const fullUrl =
        new URL(
            imageUrl,
            window.location.href
        ).href;


    modalImage.src =
        fullUrl;

    modalImage.alt =
        cleanTitle(file.name);


    modalTitle.textContent =
        cleanTitle(file.name);


    modalMeta.textContent =
        "Format: " +
        getFormat(file.name);


    imageUrlInput.value =
        fullUrl;


    modalDownload.href =
        fullUrl;


    modalDownload.download =
        file.name;


    modal.classList.add(
        "show"
    );


    document.body.style.overflow =
        "hidden";

}


/* =========================
   CLOSE PREVIEW
========================= */

function closePreview(){

    const modal =
        document.getElementById(
            "modal"
        );


    modal.classList.remove(
        "show"
    );


    document.body.style.overflow =
        "";

}


/* =========================
   COPY URL
========================= */

document
    .getElementById("copyUrl")
    .addEventListener(
        "click",
        async () => {

            const input =
                document.getElementById(
                    "imageUrl"
                );


            try{

                await navigator.clipboard
                    .writeText(
                        input.value
                    );


                const button =
                    document.getElementById(
                        "copyUrl"
                    );


                button.textContent =
                    "Copied!";


                setTimeout(
                    () => {

                        button.textContent =
                            "Copy URL";

                    },
                    1500
                );


            }catch(error){

                input.select();

                document.execCommand(
                    "copy"
                );

            }

        }
    );


/* =========================
   CLOSE BUTTONS
========================= */

document
    .getElementById("closeModal")
    .addEventListener(
        "click",
        closePreview
    );


document
    .getElementById("modalCloseButton")
    .addEventListener(
        "click",
        closePreview
    );


/* =========================
   CLICK OUTSIDE
========================= */

document
    .getElementById("modal")
    .addEventListener(
        "click",
        event => {

            if(
                event.target.id ===
                "modal"
            ){

                closePreview();

            }

        }
    );


/* =========================
   ESC KEY
========================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            closePreview();

        }

    }
);


/* =========================
   DISPLAY WALLPAPERS
========================= */

function displayWallpapers(){

    const grid =
        document.getElementById(
            "grid"
        );


    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();


    grid.innerHTML = "";


    const filtered =
        wallpapers.filter(
            file => {

                const title =
                    cleanTitle(
                        file.name
                    )
                    .toLowerCase();


                const cats =
                    getCategories(
                        file.name
                    );


                const searchMatch =
                    !search ||
                    title.includes(
                        search
                    );


                const categoryMatch =
                    selectedCategory ===
                    "all" ||
                    cats.includes(
                        selectedCategory
                    );


                return (
                    searchMatch &&
                    categoryMatch
                );

            }
        );


    if(
        !filtered.length
    ){

        grid.innerHTML =
            '<div class="empty">' +
            'No wallpapers found.' +
            '</div>';

        return;

    }


    filtered.forEach(
        file => {

            grid.appendChild(
                createCard(file)
            );

        }
    );

}


/* =========================
   LOAD FROM GITHUB
========================= */

async function loadWallpapers(){

    const grid =
        document.getElementById(
            "grid"
        );


    try{

        const response =
            await fetch(API);


        if(
            !response.ok
        ){

            throw new Error(
                "GitHub API error"
            );

        }


        const files =
            await response.json();


        wallpapers =
            files.filter(
                file =>
                    file.type ===
                    "file" &&

                    /\.(jpg|jpeg|png|webp|gif)$/i
                        .test(
                            file.name
                        )
            );


        displayWallpapers();


    }catch(error){

        console.error(error);


        grid.innerHTML =
            '<div class="empty">' +
            'Unable to load wallpapers.' +
            '</div>';

    }

}


/* =========================
   FILTER BUTTONS
========================= */

document
    .querySelectorAll(
        ".filter"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".filter"
                        )
                        .forEach(
                            b =>
                                b.classList
                                .remove(
                                    "active"
                                )
                        );


                    button.classList.add(
                        "active"
                    );


                    selectedCategory =
                        button.dataset.cat;


                    displayWallpapers();

                }
            );

        }
    );


/* =========================
   SEARCH
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        displayWallpapers
    );


/* START */

loadWallpapers();

</script>

</body>
</html>
