<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Tensei Wallpapers</title>


<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f0f0f;
    color:white;
}


/* =========================
   HEADER
========================= */

header{
    padding:25px;
    background:#181818;
    text-align:center;
}

header h1{
    margin:0;
    font-size:32px;
    letter-spacing:2px;
}

nav{
    margin-top:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 12px;
    font-size:15px;
}

nav a:hover{
    text-decoration:underline;
}


/* =========================
   CONTAINER
========================= */

.container{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

h2{
    text-align:center;
    margin-bottom:25px;
}


/* =========================
   CONTROLS
========================= */

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin-bottom:30px;
}

#search{
    width:260px;
    padding:12px 15px;
    border:0;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.filter{
    padding:11px 15px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    background:#222;
    color:white;
    font-weight:bold;
}

.filter.active,
.filter:hover{
    background:white;
    color:black;
}


/* =========================
   WALLPAPER GRID
========================= */

.grid{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(240px,1fr)
        );
    gap:22px;
}


/* =========================
   CARD
========================= */

.card{
    background:#181818;
    border-radius:12px;
    overflow:hidden;
    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:
        0 10px 30px rgba(0,0,0,.35);
}


/* =========================
   WALLPAPER IMAGE
========================= */

.card img{
    width:100%;
    height:320px;
    object-fit:contain;
    background:#111;
    display:block;
    cursor:pointer;
}


/* =========================
   INFO
========================= */

.info{
    padding:16px;
}

.info h3{
    margin:0 0 10px;
    font-size:18px;
}

.meta{
    color:#aaa;
    font-size:13px;
    line-height:1.7;
}


/* =========================
   CARD BUTTONS
========================= */

.buttons{
    display:flex;
    gap:8px;
    margin-top:14px;
}

.button{
    flex:1;
    padding:11px;
    border:0;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
    font-size:14px;
}

.preview{
    background:#333;
    color:white;
}

.download{
    background:white;
    color:black;
}

.button:hover{
    opacity:.8;
}


/* =========================
   LOADING / EMPTY
========================= */

.loading,
.empty{
    text-align:center;
    color:#aaa;
    padding:40px;
    grid-column:1/-1;
}

#loadMore{
    width:100%;
    text-align:center;
    padding:30px;
    color:#aaa;
    grid-column:1/-1;
}


/* =========================
   FOOTER
========================= */

footer{
    padding:30px;
    text-align:center;
    color:#777;
}


/* =========================
   FULLSCREEN PREVIEW
========================= */

.modal{
    position:fixed;
    inset:0;

    background:
        rgba(0,0,0,.94);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:9999;

    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-content{
    width:100%;
    max-width:1100px;
    max-height:95vh;

    display:flex;
    flex-direction:column;

    align-items:center;

    position:relative;

    overflow:auto;
}


/* =========================
   PREVIEW IMAGE
========================= */

.modal-image{
    max-width:100%;
    max-height:65vh;

    object-fit:contain;

    border-radius:8px;

    box-shadow:
        0 0 30px rgba(0,0,0,.8);
}


/* =========================
   CLOSE BUTTON
========================= */

.close{
    position:fixed;

    top:20px;
    right:20px;

    width:44px;
    height:44px;

    border:0;
    border-radius:50%;

    background:white;
    color:black;

    font-size:26px;

    cursor:pointer;

    z-index:10000;
}


/* =========================
   PREVIEW INFO
========================= */

.preview-info{
    width:100%;
    max-width:800px;

    margin-top:18px;

    background:#181818;

    padding:18px;

    border-radius:10px;
}

.preview-title{
    font-size:20px;
    font-weight:bold;

    margin-bottom:10px;
}


/* =========================
   URL BOX
========================= */

.preview-url{
    display:flex;
    gap:8px;
    margin-top:14px;
}

.preview-url input{
    flex:1;

    min-width:0;

    padding:11px;

    border:0;
    border-radius:7px;

    background:#252525;

    color:#ddd;

    outline:none;
}

.copy{
    padding:11px 16px;

    border:0;
    border-radius:7px;

    background:white;

    color:black;

    font-weight:bold;

    cursor:pointer;
}


/* =========================
   MODAL BUTTONS
========================= */

.modal-buttons{
    display:flex;

    gap:10px;

    margin-top:12px;
}

.modal-buttons a,
.modal-buttons button{

    padding:11px 18px;

    border:0;

    border-radius:7px;

    font-weight:bold;

    cursor:pointer;

    text-decoration:none;
}

.modal-download{
    background:white;
    color:black;
}

.modal-close{
    background:#333;
    color:white;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{
        padding:20px 15px;
    }

    header h1{
        font-size:28px;
    }

    nav a{
        margin:0 7px;
        font-size:14px;
    }

    .container{
        padding:30px 12px;
    }

    .grid{
        grid-template-columns:
            repeat(2,1fr);

        gap:12px;
    }

    .card img{
        height:230px;
    }

    .info{
        padding:12px;
    }

    .info h3{
        font-size:15px;
    }

    .meta{
        font-size:12px;
    }

    .buttons{
        flex-direction:column;
    }

    .modal{
        padding:12px;
    }

    .modal-image{
        max-height:55vh;
    }

    .preview-url{
        flex-direction:column;
    }

    .copy{
        width:100%;
    }

    .modal-buttons{
        width:100%;
        flex-direction:column;
    }

    .modal-buttons a,
    .modal-buttons button{
        width:100%;
    }

}


/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){

    *{
        scroll-behavior:auto !important;
        transition:none !important;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>TENSEI</h1>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="wallpapers.html">
            Wallpapers
        </a>

        <a href="#">
            About
        </a>

    </nav>

</header>



<!-- =========================
     MAIN
========================= -->

<div class="container">

    <h2>
        Wallpapers
    </h2>


    <!-- CONTROLS -->

    <div class="controls">

        <input
            id="search"
            type="search"
            placeholder="Search wallpapers..."
        >


        <button
            class="filter active"
            data-cat="all"
        >
            All
        </button>


        <button
            class="filter"
            data-cat="anime"
        >
            Anime
        </button>


        <button
            class="filter"
            data-cat="aesthetic"
        >
            Aesthetic
        </button>


        <button
            class="filter"
            data-cat="dark"
        >
            Dark
        </button>


        <button
            class="filter"
            data-cat="gaming"
        >
            Gaming
        </button>


        <button
            class="filter"
            data-cat="nature"
        >
            Nature
        </button>

    </div>



    <!-- WALLPAPER GRID -->

    <div
        id="grid"
        class="grid"
    >

        <div class="loading">
            Loading wallpapers...
        </div>

    </div>

</div>



<!-- =========================
     FOOTER
========================= -->

<footer>

    © 2026 Tensei

</footer>



<!-- =========================
     PREVIEW MODAL
========================= -->

<div
    id="modal"
    class="modal"
>

    <div class="modal-content">


        <!-- CLOSE -->

        <button
            id="closeModal"
            class="close"
            aria-label="Close preview"
        >
            ×
        </button>



        <!-- IMAGE -->

        <img
            id="modalImage"
            class="modal-image"
            src=""
            alt=""
        >



        <!-- INFORMATION -->

        <div class="preview-info">


            <div
                id="modalTitle"
                class="preview-title"
            >
                Wallpaper
            </div>


            <div
                id="modalMeta"
                class="meta"
            ></div>



            <!-- INDIVIDUAL URL -->

            <div class="preview-url">

                <input
                    id="imageUrl"
                    type="text"
                    readonly
                >


                <button
                    id="copyUrl"
                    class="copy"
                >
                    Copy URL
                </button>

            </div>



            <!-- ACTIONS -->

            <div class="modal-buttons">


                <a
                    id="modalDownload"
                    class="modal-download"
                    href=""
                    download
                >
                    Download
                </a>


                <button
                    id="modalCloseButton"
                    class="modal-close"
                >
                    Close
                </button>

            </div>

        </div>

    </div>

</div>



<script>


/* =========================
   GITHUB API
========================= */

const API =
"https://api.github.com/repos/Tensei380/tensei380.github.io/contents/wallpapers";


/* =========================
   CATEGORIES
========================= */

const categories = [

    "anime",
    "aesthetic",
    "dark",
    "gaming",
    "nature"

];


/* =========================
   VARIABLES
========================= */

let wallpapers = [];

let selectedCategory = "all";

const batchSize = 12;

let displayedCount = 0;

let isLoadingBatch = false;


/* =========================
   CLEAN TITLE
========================= */

function cleanTitle(filename){

    let name =
        filename.replace(
            /\.[^/.]+$/,
            ""
        );


    name =
        name
        .replace(
            /[_-]/g,
            " "
        )
        .replace(
            /\b(anime|aesthetic|dark|gaming|nature)\b/gi,
            ""
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();


    return name
        .replace(
            /\b\w/g,
            c => c.toUpperCase()
        )
        || "Wallpaper";

}


/* =========================
   GET CATEGORIES
========================= */

function getCategories(filename){

    const lower =
        filename.toLowerCase();


    return categories.filter(
        cat =>

            new RegExp(
                "(^|[_\\-\\s])" +
                cat +
                "([_\\-\\s.]|$)",
                "i"
            ).test(lower)

    );

}


/* =========================
   GET FORMAT
========================= */

function getFormat(filename){

    const match =
        filename.match(
            /\.([^.]+)$/
        );


    return match
        ? match[1].toUpperCase()
        : "IMAGE";

}


/* =========================
   CREATE CARD
========================= */

function createCard(file){

    const imageUrl =
        "wallpapers/" +
        encodeURIComponent(
            file.name
        );


    const card =
        document.createElement(
            "div"
        );

    card.className =
        "card";


    /* IMAGE */

    const img =
        document.createElement(
            "img"
        );


    img.src =
        imageUrl;


    img.alt =
        cleanTitle(
            file.name
        );


    img.loading =
        "lazy";


    /* PREVIEW */

    img.addEventListener(
        "click",
        () => {

            openPreview(
                file,
                imageUrl
            );

        }
    );


    /* INFO */

    const info =
        document.createElement(
            "div"
        );

    info.className =
        "info";


    /* TITLE */

    const title =
        document.createElement(
            "h3"
        );


    title.textContent =
        cleanTitle(
            file.name
        );


    /* META */

    const meta =
        document.createElement(
            "div"
        );

    meta.className =
        "meta";


    const cats =
        getCategories(
            file.name
        );


    meta.textContent =
        "Category: " +

        (
            cats.length
            ? cats.join(" • ")
            : "Wallpaper"
        )

        +

        " | Format: " +

        getFormat(
            file.name
        );


    /* RESOLUTION */

    const resolution =
        document.createElement(
            "div"
        );


    img.onload =
        () => {

            resolution.textContent =
                "Resolution: " +

                img.naturalWidth +

                " × " +

                img.naturalHeight;


            meta.appendChild(
                resolution
            );

        };


    /* BUTTONS */

    const buttons =
        document.createElement(
            "div"
        );

    buttons.className =
        "buttons";


    /* PREVIEW BUTTON */

    const preview =
        document.createElement(
            "button"
        );


    preview.className =
        "button preview";


    preview.textContent =
        "Preview";


    preview.addEventListener(
        "click",
        () => {

            openPreview(
                file,
                imageUrl
            );

        }
    );


    /* DOWNLOAD */

    const download =
        document.createElement(
            "a"
        );


    download.className =
        "button download";


    download.href =
        imageUrl;


    download.download =
        file.name;


    download.textContent =
        "Download";


    buttons.appendChild(
        preview
    );


    buttons.appendChild(
        download
    );


    /* ADD */

    info.appendChild(
        title
    );


    info.appendChild(
        meta
    );


    info.appendChild(
        buttons
    );


    card.appendChild(
        img
    );


    card.appendChild(
        info
    );


    return card;

}


/* =========================
   FILTER WALLPAPERS
========================= */

function getFilteredWallpapers(){

    const search =
        document
        .getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    return wallpapers.filter(
        file => {

            const title =
                cleanTitle(
                    file.name
                )
                .toLowerCase();


            const cats =
                getCategories(
                    file.name
                );


            const searchMatch =
                !search ||
                title.includes(
                    search
                );


            const categoryMatch =
                selectedCategory ===
                "all" ||

                cats.includes(
                    selectedCategory
                );


            return (
                searchMatch &&
                categoryMatch
            );

        }
    );

}


/* =========================
   LOAD NEXT BATCH
========================= */

function loadNextBatch(){

    if(isLoadingBatch){
        return;
    }


    const filtered =
        getFilteredWallpapers();


    if(
        displayedCount >=
        filtered.length
    ){

        updateLoadingIndicator();

        return;

    }


    isLoadingBatch = true;


    const grid =
        document.getElementById(
            "grid"
        );


    const nextItems =
        filtered.slice(
            displayedCount,
            displayedCount +
            batchSize
        );


    nextItems.forEach(
        file => {

            grid.appendChild(
                createCard(file)
            );

        }
    );


    displayedCount +=
        nextItems.length;


    isLoadingBatch = false;


    updateLoadingIndicator();

}


/* =========================
   LOADING INDICATOR
========================= */

function updateLoadingIndicator(){

    const old =
        document.getElementById(
            "loadMore"
        );


    if(old){
        old.remove();
    }


    const filtered =
        getFilteredWallpapers();


    if(
        displayedCount <
        filtered.length
    ){

        const indicator =
            document.createElement(
                "div"
            );


        indicator.id =
            "loadMore";


        indicator.className =
            "loading";


        indicator.textContent =
            "Scroll down to load more...";


        document
            .getElementById(
                "grid"
            )
            .appendChild(
                indicator
            );

    }

}


/* =========================
   RESET GALLERY
========================= */

function resetGallery(){

    const grid =
        document.getElementById(
            "grid"
        );


    grid.innerHTML =
        "";


    displayedCount =
        0;


    isLoadingBatch =
        false;


    const filtered =
        getFilteredWallpapers();


    if(!filtered.length){

        grid.innerHTML =
            '<div class="empty">' +
            'No wallpapers found.' +
            '</div>';

        return;

    }


    loadNextBatch();

}


/* =========================
   INFINITE SCROLL
========================= */

window.addEventListener(
    "scroll",
    () => {

        const distanceFromBottom =
            document.documentElement
                .scrollHeight -

            (
                window.scrollY +
                window.innerHeight
            );


        if(
            distanceFromBottom <
            600
        ){

            loadNextBatch();

        }

    }
);


/* =========================
   OPEN PREVIEW
========================= */

function openPreview(
    file,
    imageUrl
){

    const modal =
        document.getElementById(
            "modal"
        );


    const modalImage =
        document.getElementById(
            "modalImage"
        );


    const modalTitle =
        document.getElementById(
            "modalTitle"
        );


    const modalMeta =
        document.getElementById(
            "modalMeta"
        );


    const imageUrlInput =
        document.getElementById(
            "imageUrl"
        );


    const modalDownload =
        document.getElementById(
            "modalDownload"
        );


    /* FULL URL */

    const fullUrl =
        new URL(
            imageUrl,
            window.location.href
        ).href;


    /* IMAGE */

    modalImage.src =
        fullUrl;


    modalImage.alt =
        cleanTitle(
            file.name
        );


    /* TITLE */

    modalTitle.textContent =
        cleanTitle(
            file.name
        );


    /* META */

    modalMeta.textContent =
        "Format: " +
        getFormat(
            file.name
        );


    /* RESOLUTION */

    modalImage.onload =
        () => {

            modalMeta.textContent =
                "Resolution: " +
                modalImage.naturalWidth +
                " × " +
                modalImage.naturalHeight +
                " | Format: " +
                getFormat(file.name);

        };


    /* URL */

    imageUrlInput.value =
        fullUrl;


    /* DOWNLOAD */

    modalDownload.href =
        fullUrl;

    modalDownload.download =
        file.name;


    /* SHOW MODAL */

    modal.classList.add(
        "show"
    );


    /* STOP BACKGROUND SCROLL */

    document.body.style.overflow =
        "hidden";

}


/* =========================
   CLOSE PREVIEW
========================= */

function closePreview(){

    const modal =
        document.getElementById(
            "modal"
        );


    modal.classList.remove(
        "show"
    );


    document.body.style.overflow =
        "";


    document.getElementById(
        "modalImage"
    ).src = "";

}


/* =========================
   COPY URL
========================= */

document
.getElementById("copyUrl")
.addEventListener(
    "click",
    async () => {

        const input =
            document.getElementById(
                "imageUrl"
            );

        const button =
            document.getElementById(
                "copyUrl"
            );


        try{

            await navigator.clipboard
                .writeText(
                    input.value
                );


            button.textContent =
                "Copied!";


            setTimeout(
                () => {

                    button.textContent =
                        "Copy URL";

                },
                1500
            );


        }catch(error){

            input.select();

            document.execCommand(
                "copy"
            );


            button.textContent =
                "Copied!";


            setTimeout(
                () => {

                    button.textContent =
                        "Copy URL";

                },
                1500
            );

        }

    }
);


/* =========================
   CLOSE BUTTON
========================= */

document
.getElementById("closeModal")
.addEventListener(
    "click",
    closePreview
);


document
.getElementById("modalCloseButton")
.addEventListener(
    "click",
    closePreview
);


/* =========================
   CLICK OUTSIDE
========================= */

document
.getElementById("modal")
.addEventListener(
    "click",
    event => {

        if(
            event.target.id ===
            "modal"
        ){

            closePreview();

        }

    }
);


/* =========================
   ESC KEY
========================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Escape"
        ){

            closePreview();

        }

    }
);


/* =========================
   FILTER BUTTONS
========================= */

document
.querySelectorAll(".filter")
.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                document
                .querySelectorAll(
                    ".filter"
                )
                .forEach(
                    b => {

                        b.classList.remove(
                            "active"
                        );

                    }
                );


                button.classList.add(
                    "active"
                );


                selectedCategory =
                    button.dataset.cat;


                resetGallery();

            }
        );

    }
);


/* =========================
   SEARCH
========================= */

document
.getElementById("search")
.addEventListener(
    "input",
    resetGallery
);


/* =========================
   LOAD WALLPAPERS
========================= */

async function loadWallpapers(){

    const grid =
        document.getElementById(
            "grid"
        );


    try{

        const response =
            await fetch(API);


        if(
            !response.ok
        ){

            throw new Error(
                "GitHub API error"
            );

        }


        const files =
            await response.json();


        wallpapers =
            files.filter(
                file =>

                    file.type ===
                    "file"

                    &&

                    /\.(jpg|jpeg|png|webp|gif)$/i
                    .test(
                        file.name
                    )

            );


        resetGallery();


    }catch(error){

        console.error(
            error
        );


        grid.innerHTML =
            '<div class="empty">' +
            'Unable to load wallpapers.' +
            '</div>';

    }

}


/* =========================
   START
========================= */

loadWallpapers();

</script>

</body>

</html>
