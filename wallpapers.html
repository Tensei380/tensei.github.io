<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tensei Wallpapers</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f0f0f;
    color:white;
}

header{
    padding:25px;
    background:#181818;
    text-align:center;
}

header h1{
    margin:0;
    font-size:32px;
}

nav{
    margin-top:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 12px;
    font-size:15px;
}

nav a:hover{
    text-decoration:underline;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

h2{
    text-align:center;
    margin-bottom:25px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin-bottom:30px;
}

#search{
    width:260px;
    padding:12px 15px;
    border:0;
    border-radius:8px;
    outline:none;
}

.filter{
    padding:11px 15px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    background:#222;
    color:white;
}

.filter.active,
.filter:hover{
    background:white;
    color:black;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:22px;
}

.card{
    background:#181818;
    border-radius:12px;
    overflow:hidden;
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
    display:block;
}

.info{
    padding:16px;
}

.info h3{
    margin:0 0 10px;
    font-size:18px;
}

.meta{
    color:#aaa;
    font-size:13px;
    line-height:1.7;
}

.download{
    display:block;
    width:100%;
    margin-top:14px;
    padding:11px;
    background:white;
    color:black;
    text-align:center;
    text-decoration:none;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.download:hover{
    opacity:.8;
}

.loading,
.empty{
    text-align:center;
    color:#aaa;
    padding:40px;
    grid-column:1/-1;
}

footer{
    padding:30px;
    text-align:center;
    color:#777;
}
</style>
</head>

<body>

<header>
    <h1>TENSEI</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="wallpapers.html">Wallpapers</a>
        <a href="#">About</a>
    </nav>
</header>

<div class="container">

    <h2>Wallpapers</h2>

    <div class="controls">
        <input id="search" type="search" placeholder="Search wallpapers...">

        <button class="filter active" data-cat="all">All</button>
        <button class="filter" data-cat="anime">Anime</button>
        <button class="filter" data-cat="aesthetic">Aesthetic</button>
        <button class="filter" data-cat="dark">Dark</button>
        <button class="filter" data-cat="gaming">Gaming</button>
        <button class="filter" data-cat="nature">Nature</button>
    </div>

    <div id="grid" class="grid">
        <div class="loading">Loading wallpapers...</div>
    </div>

</div>

<footer>
    © 2026 Tensei
</footer>

<script>
const API =
"https://api.github.com/repos/Tensei380/Tensei380.github.io/contents/wallpapers";

const categories =
["anime","aesthetic","dark","gaming","nature"];

let wallpapers = [];
let selectedCategory = "all";

function cleanTitle(filename){

    let name = filename.replace(/\.[^/.]+$/,"");

    name = name
        .replace(/[_-]/g," ")
        .replace(/\b(anime|aesthetic|dark|gaming|nature)\b/gi,"")
        .replace(/\s+/g," ")
        .trim();

    return name.replace(/\b\w/g,c=>c.toUpperCase()) || "Wallpaper";
}

function getCategories(filename){

    const lower = filename.toLowerCase();

    return categories.filter(cat =>
        new RegExp("(^|[_\\-\\s])"+cat+"([_\\-\\s.]|$)","i").test(lower)
    );
}

function getFormat(filename){

    const match = filename.match(/\.([^.]+)$/);
    return match ? match[1].toUpperCase() : "IMAGE";
}

function createCard(file){

    const imageUrl =
        "wallpapers/" + encodeURIComponent(file.name);

    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = imageUrl;
    img.alt = cleanTitle(file.name);
    img.loading = "lazy";

    const info = document.createElement("div");
    info.className = "info";

    const title = document.createElement("h3");
    title.textContent = cleanTitle(file.name);

    const meta = document.createElement("div");
    meta.className = "meta";

    const cats = getCategories(file.name);

    meta.textContent =
        "Category: " +
        (cats.length ? cats.join(" • ") : "Wallpaper") +
        " | Format: " +
        getFormat(file.name);

    const resolution = document.createElement("div");

    img.onload = () => {
        resolution.textContent =
            "Resolution: " +
            img.naturalWidth +
            " × " +
            img.naturalHeight;

        meta.appendChild(resolution);
    };

    const download = document.createElement("a");
    download.className = "download";
    download.href = imageUrl;
    download.download = file.name;
    download.textContent = "Download";

    info.appendChild(title);
    info.appendChild(meta);
    info.appendChild(download);

    card.appendChild(img);
    card.appendChild(info);

    return card;
}

function displayWallpapers(){

    const grid = document.getElementById("grid");
    const search =
        document.getElementById("search").value.toLowerCase().trim();

    grid.innerHTML = "";

    const filtered = wallpapers.filter(file => {

        const title = cleanTitle(file.name).toLowerCase();
        const cats = getCategories(file.name);

        const searchMatch =
            !search || title.includes(search);

        const categoryMatch =
            selectedCategory === "all" ||
            cats.includes(selectedCategory);

        return searchMatch && categoryMatch;
    });

    if(!filtered.length){

        grid.innerHTML =
            '<div class="empty">No wallpapers found.</div>';

        return;
    }

    filtered.forEach(file => {
        grid.appendChild(createCard(file));
    });
}

async function loadWallpapers(){

    const grid = document.getElementById("grid");

    try{

        const response = await fetch(API);

        if(!response.ok){
            throw new Error("GitHub API error");
        }

        const files = await response.json();

        wallpapers = files.filter(file =>
            file.type === "file" &&
            /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)
        );

        displayWallpapers();

    }catch(error){

        console.error(error);

        grid.innerHTML =
            '<div class="empty">Unable to load wallpapers.</div>';
    }
}

document.querySelectorAll(".filter").forEach(button => {

    button.addEventListener("click", () => {

        document
            .querySelectorAll(".filter")
            .forEach(b => b.classList.remove("active"));

        button.classList.add("active");

        selectedCategory = button.dataset.cat;

        displayWallpapers();
    });
});

document
    .getElementById("search")
    .addEventListener("input", displayWallpapers);

loadWallpapers();
</script>

</body>
</html>
