<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tensei Wallpapers</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
        }

        header {
            padding: 25px;
            background: #181818;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 50px 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .title p {
            color: #aaaaaa;
        }

        /* Search */
        .search-box {
            max-width: 600px;
            margin: 0 auto 25px auto;
        }

        .search-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 15px 18px;
            border: none;
            border-radius: 8px;
            background: #202020;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .search-box input::placeholder {
            color: #888888;
        }

        /* Categories */
        .categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 40px;
        }

        .category-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            background: #202020;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .category-btn:hover {
            background: #333333;
        }

        .category-btn.active {
            background: white;
            color: black;
        }

        /* Gallery */
        .wallpaper-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(250px, 1fr)
            );
            gap: 25px;
        }

        .wallpaper-card {
            background: #181818;
            border-radius: 12px;
            overflow: hidden;
        }

        .wallpaper-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .wallpaper-info {
            padding: 20px;
        }

        .wallpaper-info h3 {
            margin-top: 0;
        }

        .wallpaper-info p {
            color: #aaaaaa;
        }

        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 20px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .button:hover {
            opacity: 0.8;
        }

        .no-result {
            display: none;
            text-align: center;
            color: #888888;
            margin-top: 30px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777777;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>

        <h1>TENSEI</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="wallpapers.html">Wallpapers</a>
            <a href="#">About</a>
        </nav>

    </header>


    <div class="container">

        <div class="title">

            <h2>Wallpapers</h2>

            <p>
                Discover wallpapers from Tensei.
            </p>

        </div>


        <!-- Search -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search wallpapers..."
                onkeyup="filterWallpapers()"
            >

        </div>


        <!-- Categories -->

        <div class="categories">

            <button
                class="category-btn active"
                onclick="selectCategory('all', this)">
                All
            </button>

            <button
                class="category-btn"
                onclick="selectCategory('anime', this)">
                Anime
            </button>

            <button
                class="category-btn"
                onclick="selectCategory('aesthetic', this)">
                Aesthetic
            </button>

            <button
                class="category-btn"
                onclick="selectCategory('dark', this)">
                Dark
            </button>

            <button
                class="category-btn"
                onclick="selectCategory('gaming', this)">
                Gaming
            </button>

            <button
                class="category-btn"
                onclick="selectCategory('nature', this)">
                Nature
            </button>

        </div>


        <!-- Wallpaper Gallery -->

        <div
            class="wallpaper-grid"
            id="wallpaperGrid"
        >


            <!-- Wallpaper 1 -->

            <div
                class="wallpaper-card"
                data-category="anime dark"
            >

                <img
                    src="wallpapers/black%20anime%20dp.jpeg"
                    alt="Black Anime DP"
                >


                <div class="wallpaper-info">

                    <h3>
                        Black Anime DP
                    </h3>

                    <p>
                        Anime • Dark
                    </p>

                    <a
                        href="wallpapers/black%20anime%20dp.jpeg"
                        class="button"
                        download
                    >
                        Download
                    </a>

                </div>

            </div>


        </div>


        <!-- No Result -->

        <div
            class="no-result"
            id="noResult"
        >
            No wallpaper found.
        </div>


    </div>


    <footer>

        © 2026 Tensei

    </footer>


    <script>

        let selectedCategory = "all";


        function selectCategory(category, button) {

            selectedCategory = category;


            let buttons =
                document.getElementsByClassName(
                    "category-btn"
                );


            for (
                let i = 0;
                i < buttons.length;
                i++
            ) {

                buttons[i].classList.remove(
                    "active"
                );

            }


            button.classList.add("active");


            filterWallpapers();

        }



        function filterWallpapers() {

            let searchText =
                document
                .getElementById("searchInput")
                .value
                .toLowerCase();


            let cards =
                document.getElementsByClassName(
                    "wallpaper-card"
                );


            let found = false;


            for (
                let i = 0;
                i < cards.length;
                i++
            ) {

                let title =
                    cards[i]
                    .getElementsByTagName("h3")[0]
                    .innerText
                    .toLowerCase();


                let categories =
                    cards[i]
                    .getAttribute("data-category")
                    .toLowerCase();


                let searchMatch =
                    title.includes(searchText);


                let categoryMatch =
                    selectedCategory === "all" ||
                    categories.includes(
                        selectedCategory
                    );


                if (
                    searchMatch &&
                    categoryMatch
                ) {

                    cards[i].style.display =
                        "block";

                    found = true;

                } else {

                    cards[i].style.display =
                        "none";

                }

            }


            document
                .getElementById("noResult")
                .style.display =
                found ? "none" : "block";

        }

    </script>

</body>
</html>
