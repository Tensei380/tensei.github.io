<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tensei Wallpapers</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
        }


        /* HEADER */

        header {
            padding: 25px;
            background: #181818;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 2px;
        }


        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-size: 15px;
        }

        nav a:hover {
            color: #cccccc;
        }


        /* MAIN */

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 50px 20px;
        }


        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .title p {
            color: #aaaaaa;
        }


        /* SEARCH */

        .search-box {
            max-width: 600px;
            margin: 0 auto 25px auto;
        }

        .search-box input {
            width: 100%;
            padding: 16px 18px;
            border: 1px solid #292929;
            border-radius: 10px;
            background: #1b1b1b;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: #555555;
        }

        .search-box input::placeholder {
            color: #888888;
        }


        /* CATEGORIES */

        .categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 40px;
        }

        .category-btn {
            padding: 10px 18px;
            border: 1px solid #303030;
            border-radius: 8px;
            background: #202020;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: 0.25s;
        }

        .category-btn:hover {
            background: #303030;
            transform: translateY(-2px);
        }

        .category-btn.active {
            background: white;
            color: black;
            border-color: white;
        }


        /* WALLPAPER GRID */

        .wallpaper-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(250px, 1fr)
            );

            gap: 25px;
        }


        /* CARD */

        .wallpaper-card {
            background: #181818;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #252525;
            transition:
                transform 0.3s,
                border-color 0.3s,
                box-shadow 0.3s;
        }

        .wallpaper-card:hover {
            transform: translateY(-6px);
            border-color: #444444;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }


        /* IMAGE */

        .image-container {
            overflow: hidden;
            background: #111111;
        }

        .wallpaper-card img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.4s ease;
        }

        .wallpaper-card:hover img {
            transform: scale(1.04);
        }


        /* INFO */

        .wallpaper-info {
            padding: 20px;
        }

        .wallpaper-info h3 {
            margin: 0 0 8px 0;
            font-size: 20px;
        }

        .wallpaper-info p {
            color: #aaaaaa;
            margin: 0;
        }


        /* DOWNLOAD BUTTON */

        .button {
            display: inline-block;
            width: 100%;
            margin-top: 18px;
            padding: 13px 20px;
            background: white;
            color: black;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.25s;
        }

        .button:hover {
            background: #dddddd;
            transform: translateY(-2px);
        }


        /* NO RESULT */

        .no-result {
            display: none;
            text-align: center;
            color: #888888;
            margin-top: 30px;
            font-size: 16px;
        }


        /* FOOTER */

        footer {
            text-align: center;
            padding: 25px;
            color: #777777;
            margin-top: 40px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding: 20px;
            }

            header h1 {
                font-size: 28px;
            }

            nav a {
                margin: 0 7px;
                font-size: 14px;
            }

            .container {
                padding: 35px 15px;
            }

            .title h2 {
                font-size: 30px;
            }

            .wallpaper-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .category-btn {
                padding: 9px 14px;
            }

        }

    </style>
</head>


<body>


    <!-- HEADER -->

    <header>

        <h1>TENSEI</h1>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="wallpapers.html">
                Wallpapers
            </a>

            <a href="#">
                About
            </a>

        </nav>

    </header>



    <!-- MAIN -->

    <div class="container">


        <div class="title">

            <h2>
                Wallpapers
            </h2>

            <p>
                Discover wallpapers from Tensei.
            </p>

        </div>



        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search wallpapers..."
                onkeyup="filterWallpapers()"
            >

        </div>



        <!-- CATEGORIES -->

        <div class="categories">

            <button
                class="category-btn active"
                onclick="selectCategory('all', this)"
            >
                All
            </button>


            <button
                class="category-btn"
                onclick="selectCategory('anime', this)"
            >
                Anime
            </button>


            <button
                class="category-btn"
                onclick="selectCategory('aesthetic', this)"
            >
                Aesthetic
            </button>


            <button
                class="category-btn"
                onclick="selectCategory('dark', this)"
            >
                Dark
            </button>


            <button
                class="category-btn"
                onclick="selectCategory('gaming', this)"
            >
                Gaming
            </button>


            <button
                class="category-btn"
                onclick="selectCategory('nature', this)"
            >
                Nature
            </button>

        </div>



        <!-- WALLPAPER GRID -->

        <div
            class="wallpaper-grid"
            id="wallpaperGrid"
        >


            <!-- BLACK ANIME DP -->

            <div
                class="wallpaper-card"
                data-category="anime dark"
            >

                <div class="image-container">

                    <img
                        src="wallpapers/black%20anime%20dp.jpeg"
                        alt="Black Anime DP"
                    >

                </div>


                <div class="wallpaper-info">

                    <h3>
                        Black Anime DP
                    </h3>

                    <p>
                        Anime • Dark
                    </p>


                    <a
                        href="wallpapers/black%20anime%20dp.jpeg"
                        class="button"
                        download
                    >
                        Download
                    </a>

                </div>

            </div>



            <!-- MADARA UCHIHA -->

            <div
                class="wallpaper-card"
                data-category="anime dark"
            >

                <div class="image-container">

                    <img
                        src="wallpapers/madara_uchiha.webp"
                        alt="Madara Uchiha"
                    >

                </div>


                <div class="wallpaper-info">

                    <h3>
                        Madara Uchiha
                    </h3>

                    <p>
                        Anime • Dark
                    </p>


                    <a
                        href="wallpapers/madara_uchiha.webp"
                        class="button"
                        download
                    >
                        Download
                    </a>

                </div>

            </div>


        </div>



        <!-- NO RESULT -->

        <div
            class="no-result"
            id="noResult"
        >
            No wallpaper found.
        </div>


    </div>



    <!-- FOOTER -->

    <footer>

        © 2026 Tensei

    </footer>



    <!-- JAVASCRIPT -->

    <script>

        let selectedCategory = "all";


        function selectCategory(category, button) {

            selectedCategory = category;


            let buttons =
                document.getElementsByClassName(
                    "category-btn"
                );


            for (
                let i = 0;
                i < buttons.length;
                i++
            ) {

                buttons[i].classList.remove(
                    "active"
                );

            }


            button.classList.add("active");


            filterWallpapers();

        }



        function filterWallpapers() {

            let searchText =
                document
                .getElementById("searchInput")
                .value
                .toLowerCase();


            let cards =
                document.getElementsByClassName(
                    "wallpaper-card"
                );


            let found = false;


            for (
                let i = 0;
                i < cards.length;
                i++
            ) {

                let title =
                    cards[i]
                    .getElementsByTagName("h3")[0]
                    .innerText
                    .toLowerCase();


                let categories =
                    cards[i]
                    .getAttribute("data-category")
                    .toLowerCase();


                let searchMatch =
                    title.includes(searchText);


                let categoryMatch =
                    selectedCategory === "all" ||
                    categories.includes(
                        selectedCategory
                    );


                if (
                    searchMatch &&
                    categoryMatch
                ) {

                    cards[i].style.display =
                        "block";

                    found = true;

                }

                else {

                    cards[i].style.display =
                        "none";

                }

            }


            document
                .getElementById("noResult")
                .style.display =
                found ? "none" : "block";

        }

    </script>


</body>
</html>
