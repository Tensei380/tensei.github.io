<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tensei Wallpapers</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
        }


        /* HEADER */

        header {
            padding: 25px;
            background: #181818;
            text-align: center;
        }


        header h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 2px;
        }


        nav {
            margin-top: 15px;
        }


        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-size: 15px;
        }


        nav a:hover {
            color: #cccccc;
        }


        /* MAIN */

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 50px 20px;
        }


        .title {
            text-align: center;
            margin-bottom: 30px;
        }


        .title h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }


        .title p {
            color: #aaaaaa;
        }


        /* SEARCH */

        .search-box {
            max-width: 600px;
            margin: 0 auto 25px auto;
        }


        .search-box input {
            width: 100%;
            padding: 16px 18px;

            border: 1px solid #292929;
            border-radius: 10px;

            background: #1b1b1b;
            color: white;

            font-size: 16px;
            outline: none;
        }


        .search-box input:focus {
            border-color: #555555;
        }


        .search-box input::placeholder {
            color: #888888;
        }


        /* CATEGORIES */

        .categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;

            gap: 10px;
            margin-bottom: 40px;
        }


        .category-btn {
            padding: 10px 18px;

            border: 1px solid #303030;
            border-radius: 8px;

            background: #202020;
            color: white;

            cursor: pointer;
            font-size: 14px;

            transition: 0.25s;
        }


        .category-btn:hover {
            background: #303030;
            transform: translateY(-2px);
        }


        .category-btn.active {
            background: white;
            color: black;
            border-color: white;
        }


        /* GRID */

        .wallpaper-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(250px, 1fr)
                );

            gap: 25px;
        }


        /* CARD */

        .wallpaper-card {
            background: #181818;

            border-radius: 14px;
            overflow: hidden;

            border: 1px solid #252525;

            transition:
                transform 0.3s,
                border-color 0.3s,
                box-shadow 0.3s;
        }


        .wallpaper-card:hover {
            transform: translateY(-6px);

            border-color: #444444;

            box-shadow:
                0 12px 30px
                rgba(0, 0, 0, 0.5);
        }


        /* IMAGE */

        .image-container {
            overflow: hidden;
            background: #111111;
        }


        .wallpaper-card img {
            width: 100%;
            height: auto;

            display: block;

            transition:
                transform 0.4s ease;
        }


        .wallpaper-card:hover img {
            transform: scale(1.04);
        }


        /* INFO */

        .wallpaper-info {
            padding: 20px;
        }


        .wallpaper-info h3 {
            margin: 0 0 8px 0;
            font-size: 20px;
        }


        .wallpaper-info p {
            color: #aaaaaa;
            margin: 7px 0;
        }


        .resolution {
            color: #888888;
            font-size: 14px;
        }


        .format {
            color: #888888;
            font-size: 14px;
        }


        /* DOWNLOAD BUTTON */

        .button {
            display: block;

            width: 100%;

            margin-top: 18px;

            padding: 13px 20px;

            background: white;
            color: black;

            text-decoration: none;
            text-align: center;

            border: none;
            border-radius: 8px;

            font-weight: bold;
            font-size: 15px;

            cursor: pointer;

            transition: 0.25s;
        }


        .button:hover {
            background: #dddddd;

            transform:
                translateY(-2px);
        }


        /* LOADING */

        .loading {
            grid-column: 1 / -1;

            text-align: center;

            color: #888888;

            padding: 40px;
        }


        /* NO RESULT */

        .no-result {
            display: none;

            text-align: center;

            color: #888888;

            margin-top: 30px;
        }


        /* FOOTER */

        footer {
            text-align: center;

            padding: 25px;

            color: #777777;

            margin-top: 40px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding: 20px;
            }


            header h1 {
                font-size: 28px;
            }


            nav a {
                margin: 0 7px;
                font-size: 14px;
            }


            .container {
                padding: 35px 15px;
            }


            .title h2 {
                font-size: 30px;
            }


            .wallpaper-grid {
                grid-template-columns: 1fr;

                gap: 20px;
            }


            .category-btn {
                padding: 9px 14px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <h1>TENSEI</h1>


        <nav>

            <a href="index.html">
                Home
            </a>


            <a href="wallpapers.html">
                Wallpapers
            </a>


            <a href="#">
                About
            </a>

        </nav>

    </header>



    <!-- MAIN -->

    <div class="container">


        <div class="title">

            <h2>
                Wallpapers
            </h2>


            <p>
                Discover wallpapers from Tensei.
            </p>

        </div>



        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search wallpapers..."
                onkeyup="filterWallpapers()"
            >

        </div>



        <!-- CATEGORIES -->

        <div class="categories">

            <button
                class="category-btn active"
                onclick="selectCategory('all', this)"
            >
                All
            </button>


            <button
                class="category-btn"
                onclick="selectCategory('anime', this)"
            >
                Anime
            </button>


            <button
                class="category-btn"
                onclick="selectCategory('aesthetic', this)"
            >
                Aesthetic
            </button>


            <button
                class="category-btn"
                onclick="selectCategory('dark', this)"
            >
                Dark
            </button>


            <button
                class="category-btn"
                onclick="selectCategory('gaming', this)"
            >
                Gaming
            </button>


            <button
                class="category-btn"
                onclick="selectCategory('nature', this)"
            >
                Nature
            </button>

        </div>



        <!-- AUTOMATIC GALLERY -->

        <div
            class="wallpaper-grid"
            id="wallpaperGrid"
        >

            <div
                class="loading"
                id="loading"
            >
                Loading wallpapers...
            </div>

        </div>



        <div
            class="no-result"
            id="noResult"
        >
            No wallpaper found.
        </div>


    </div>



    <!-- FOOTER -->

    <footer>

        © 2026 Tensei

    </footer>



    <script>


        /* GITHUB REPOSITORY */

        const username =
            "Tensei380";


        const repository =
            "Tensei380.github.io";


        const folder =
            "wallpapers";


        let selectedCategory =
            "all";


        let wallpapers =
            [];



        /* LOAD WALLPAPERS FROM GITHUB */

        async function loadWallpapers() {

            const url =
                "https://api.github.com/repos/" +
                username +
                "/" +
                repository +
                "/contents/" +
                folder;


            try {

                const response =
                    await fetch(url);


                if (!response.ok) {

                    throw new Error(
                        "Could not load wallpapers."
                    );

                }


                const files =
                    await response.json();


                wallpapers =
                    files.filter(
                        function(file) {

                            return (
                                file.type === "file" &&
                                /\.(jpg|jpeg|png|webp|gif)$/i
                                .test(file.name)
                            );

                        }
                    );


                displayWallpapers();

            }


            catch (error) {

                document
                    .getElementById("loading")
                    .innerText =
                    "Unable to load wallpapers.";

                console.error(error);

            }

        }



        /* CREATE TITLE */

        function createTitle(filename) {

            let name =
                filename.replace(
                    /\.(jpg|jpeg|png|webp|gif)$/i,
                    ""
                );


            const categories = [
                "anime",
                "aesthetic",
                "dark",
                "gaming",
                "nature"
            ];


            let words =
                name.split(/[_\-\s]+/);


            words =
                words.filter(
                    function(word) {

                        return !categories.includes(
                            word.toLowerCase()
                        );

                    }
                );


            return words
                .map(
                    function(word) {

                        return (
                            word.charAt(0).toUpperCase() +
                            word.slice(1)
                        );

                    }
                )
                .join(" ");

        }



        /* GET CATEGORIES */

        function getCategories(filename) {

            let name =
                filename.toLowerCase();


            const categories = [
                "anime",
                "aesthetic",
                "dark",
                "gaming",
                "nature"
            ];


            return categories.filter(
                function(category) {

                    return (
                        name
                        .split(/[_\-\s]+/)
                        .includes(category)
                    );

                }
            );

        }



        /* GET FORMAT */

        function getFormat(filename) {

            return filename
                .split(".")
                .pop()
                .toUpperCase();

        }



        /* DISPLAY WALLPAPERS */

        function displayWallpapers() {

            const grid =
                document.getElementById(
                    "wallpaperGrid"
                );


            grid.innerHTML = "";


            if (wallpapers.length === 0) {

                document
                    .getElementById("noResult")
                    .style.display =
                    "block";

                return;

            }


            wallpapers.forEach(
                function(file) {

                    const categories =
                        getCategories(
                            file.name
                        );


                    const title =
                        createTitle(
                            file.name
                        );


                    let categoryText =
                        "Wallpaper";


                    if (
                        categories.length > 0
                    ) {

                        categoryText =
                            categories
                            .map(
                                function(category) {

                                    return (
                                        category
                                        .charAt(0)
                                        .toUpperCase() +
                                        category.slice(1)
                                    );

                                }
                            )
                            .join(" • ");

                    }


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "wallpaper-card";


                    card.setAttribute(
                        "data-category",
                        categories.join(" ")
                    );


                    card.setAttribute(
                        "data-title",
                        title.toLowerCase()
                    );


                    card.innerHTML = `

                        <div class="image-container">

                            <img
                                src="${file.download_url}"
                                alt="${title}"
                                loading="lazy"
                            >

                        </div>


                        <div class="wallpaper-info">

                            <h3>
                                ${title}
                            </h3>


                            <p>
                                ${categoryText}
                            </p>


                            <p class="resolution">

                                Resolution:
                                <span class="image-resolution">
                                    Loading...
                                </span>

                            </p>


                            <p class="format">

                                Format:
                                ${getFormat(file.name)}

                            </p>


                            <button
                                class="button"
                                onclick="downloadWallpaper(
                                    '${file.download_url}',
                                    '${file.name.replace(/'/g, "\\'")}'
                                )"
                            >
                                Download
                            </button>

                        </div>

                    `;


                    const image =
                        card.querySelector(
                            "img"
                        );


                    image.onload =
                        function() {

                            const resolution =
                                card.querySelector(
                                    ".image-resolution"
                                );


                            resolution.innerText =
                                image.naturalWidth +
                                " × " +
                                image.naturalHeight;

                        };


                    grid.appendChild(card);

                }
            );


            filterWallpapers();

        }



        /* DOWNLOAD WALLPAPER */

        async function downloadWallpaper(
            url,
            filename
        ) {

            try {

                const response =
                    await fetch(url);


                if (!response.ok) {

                    throw new Error(
                        "Download failed"
                    );

                }


                const blob =
                    await response.blob();


                const blobUrl =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    blobUrl;


                link.download =
                    filename;


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                URL.revokeObjectURL(
                    blobUrl
                );

            }


            catch (error) {

                console.error(error);


                /* FALLBACK */

                window.open(
                    url,
                    "_blank"
                );

            }

        }



        /* CATEGORY FILTER */

        function selectCategory(
            category,
            button
        ) {

            selectedCategory =
                category;


            const buttons =
                document.getElementsByClassName(
                    "category-btn"
                );


            for (
                let i = 0;
                i < buttons.length;
                i++
            ) {

                buttons[i]
                    .classList
                    .remove("active");

            }


            button.classList.add(
                "active"
            );


            filterWallpapers();

        }



        /* SEARCH + CATEGORY FILTER */

        function filterWallpapers() {

            const searchText =
                document
                .getElementById(
                    "searchInput"
                )
                .value
                .toLowerCase()
                .trim();


            const cards =
                document.getElementsByClassName(
                    "wallpaper-card"
                );


            let found =
                false;


            for (
                let i = 0;
                i < cards.length;
                i++
            ) {

                const title =
                    cards[i]
                    .getAttribute(
                        "data-title"
                    );


                const categories =
                    cards[i]
                    .getAttribute(
                        "data-category"
                    )
                    .split(" ");


                const searchMatch =
                    title.includes(
                        searchText
                    );


                const categoryMatch =
                    selectedCategory === "all" ||
                    categories.includes(
                        selectedCategory
                    );


                if (
                    searchMatch &&
                    categoryMatch
                ) {

                    cards[i]
                        .style
                        .display =
                found
                ? "none"
                : "block";

        }



        /* START */

        loadWallpapers();


    </script>


</body>

</html>
